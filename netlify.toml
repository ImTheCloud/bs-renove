# Hébergement Netlify : construit depuis GitHub à chaque push.
# Les formulaires (devis, candidature) passent par Netlify Forms : détection et
# emails de notification se règlent dans Netlify → Forms (pas dans ce fichier).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers du site avec une empreinte dans leur nom : ils ne changent jamais, on les garde en cache un an.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Protections pour toutes les pages : types de fichiers, référent, pas d'affichage dans un cadre étranger, pas d'accès aux capteurs,
# et une politique qui n'autorise que les fichiers du site (aucun script, image ni police venus d'ailleurs).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Page introuvable en néerlandais pour tout ce qui commence par /nl/ (sinon la 404 française).
[[redirects]]
  from = "/nl/*"
  to = "/nl/404/"
  status = 404
