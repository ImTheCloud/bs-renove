  fr:
    depart: "[À CONFIRMER : l'état général de la maison au départ, en une ou deux phrases.]"
    travaux: "Rénovation complète de la maison : plomberie et électricité entièrement reprises, nouvelle salle de bain avec douche à l'italienne, toilette refaite, deux escaliers (intérieur et garage), plafonds, cuisine, et auvent d'entrée."
    resultat: "[À CONFIRMER : le résultat, vu par le propriétaire.]"
  nl:
    depart: "[TE BEVESTIGEN: de algemene toestand van de woning bij aanvang, in één of twee zinnen.]"
    travaux: "Volledige renovatie van de woning: loodgieterij en elektriciteit volledig vernieuwd, nieuwe badkamer met inloopdouche, nieuw toilet, twee trappen (binnen en garage), plafonds, keuken en luifel boven de voordeur."
    resultat: "[TE BEVESTIGEN: het resultaat, gezien door de eigenaar.]"
